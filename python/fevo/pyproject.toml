[project]
name = "fevo"
version = "0.1.0"
description = "Train racing agents locally on the exact simulator fevo scores with (same sim.wasm, via wasmtime)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["wasmtime>=25"]

[project.optional-dependencies]
neat = ["neat-python>=2.0.0"]

[project.scripts]
fevo = "fevo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "neat-python>=2.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fevo"]
