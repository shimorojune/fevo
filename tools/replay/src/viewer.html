<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fevo replay</title>
<style>
  :root {
    --bg: #f5f4ef; --panel: #ffffff; --fg: #1f1e1d; --muted: #6b6a68; --line: #e3e1da;
    --grass: #e9eadf; --asphalt: #3b3b3e; --edge: #ffffff; --gate: rgba(127,178,255,.35);
    --start: #e5484d; --accent: #2563eb; --trail: rgba(37,99,235,.55);
    --speed: #2563eb; --throttle: #16a34a; --brake: #dc2626; --steer: #7c3aed;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --panel: #1e1e1d; --fg: #ecebe8; --muted: #9b9a97; --line: #2e2e2c;
      --grass: #1b1d18; --asphalt: #4a4a4f; --trail: rgba(96,165,250,.6); --speed: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0 8px 0 0; }
  select, button, input[type=range] { font: inherit; color: inherit; }
  select, button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  #main { display: block; width: 100%; height: min(68vh, 720px); background: var(--grass); }
  #map { display: block; width: 100%; aspect-ratio: 1; }
  #tele { display: block; width: 100%; height: 120px; }
  .side { display: flex; flex-direction: column; gap: 16px; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
  .stat .k { color: var(--muted); font-size: 12px; } .stat .v { font-size: 22px; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; position: relative; overflow: hidden; }
  .bar i { position: absolute; top: 0; bottom: 0; }
  .meta { padding: 0 12px 12px; color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
  td, th { padding: 4px 12px; text-align: left; border-top: 1px solid var(--line); } th { color: var(--muted); font-weight: 500; }
  .hint { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 8px; align-items: center; }
</style>
</head>
<body>
<header>
  <h1>fevo replay</h1>
  <label class="row">Circuit <select id="circuit"></select></label>
  <label class="row">Agent <select id="agent"></select></label>
  <button id="play" class="primary">Pause</button>
  <button id="restart">Restart</button>
  <label class="row">Speed <select id="rate"><option>0.5</option><option selected>1</option><option>2</option><option>4</option><option>8</option></select>×</label>
  <label class="row">Zoom <input id="zoom" type="range" min="1" max="30" step="0.5" value="8"></label>
  <span class="hint">Space pauses, R restarts, ← → step one frame, + − zoom.</span>
</header>
<div class="grid">
  <div class="panel">
    <canvas id="main"></canvas>
    <canvas id="tele"></canvas>
  </div>
  <div class="side">
    <div class="panel">
      <div class="stats">
        <div class="stat"><div class="k">Lap time</div><div class="v" id="time">0:00.00</div></div>
        <div class="stat"><div class="k">Speed</div><div class="v" id="speed">0 km/h</div></div>
        <div class="stat"><div class="k">Gate</div><div class="v" id="gate">0</div></div>
        <div class="stat"><div class="k">Result</div><div class="v" id="result" style="font-size:16px">–</div></div>
        <div class="stat" style="grid-column: span 2"><div class="k">Tyres</div><div class="v" id="tyres" style="font-size:16px">–</div></div>
      </div>
      <div style="padding:0 12px 12px">
        <div class="k hint">Throttle / brake</div><div class="bar"><i id="thr"></i></div>
        <div class="k hint" style="margin-top:8px">Steer (left − / right +)</div><div class="bar"><i id="str"></i></div>
      </div>
      <div class="meta" id="meta"></div>
      <table id="official"></table>
    </div>
    <div class="panel"><canvas id="map"></canvas></div>
  </div>
</div>
<script>
const DATA = /*__DATA__*/null;
const $ = (id) => document.getElementById(id);
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------- geometry ----------
const geo = {};
for (const t of DATA.tracks) {
  const n = t.widthLeft.length, c = t.centerline;
  const left = new Path2D(), right = new Path2D(), centre = new Path2D();
  const L = [], Rr = [];
  for (let i = 0; i < n; i++) {
    const p = (i - 1 + n) % n, q = (i + 1) % n;
    const tx = c[2*q] - c[2*p], ty = c[2*q+1] - c[2*p+1], len = Math.hypot(tx, ty);
    const nx = -ty / len, ny = tx / len, x = c[2*i], y = c[2*i+1];
    L.push([x + nx * t.widthLeft[i], y + ny * t.widthLeft[i]]);
    Rr.push([x - nx * t.widthRight[i], y - ny * t.widthRight[i]]);
  }
  L.forEach(([x, y], i) => i ? left.lineTo(x, y) : left.moveTo(x, y)); left.closePath();
  Rr.forEach(([x, y], i) => i ? right.lineTo(x, y) : right.moveTo(x, y)); right.closePath();
  for (let i = 0; i <= n; i++) { const k = i % n; i ? centre.lineTo(c[2*k], c[2*k+1]) : centre.moveTo(c[0], c[1]); }
  const surface = new Path2D(); surface.addPath(left); surface.addPath(right);
  const gates = new Path2D();
  for (const g of t.gates) { gates.moveTo(...L[g]); gates.lineTo(...Rr[g]); }
  const start = new Path2D(); start.moveTo(...L[t.gates[0]]); start.lineTo(...Rr[t.gates[0]]);
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const [x, y] of [...L, ...Rr]) { minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y); }
  geo[t.id] = { t, left, right, centre, surface, gates, start, bounds: { minX, minY, maxX, maxY } };
}

// ---------- state ----------
const circuits = [...new Set(DATA.laps.map((l) => l.circuitId))];
const agents = [...new Set(DATA.laps.map((l) => l.agent))];
for (const id of circuits) $("circuit").add(new Option(DATA.tracks.find((t) => t.id === id).name, id));
for (const a of agents) $("agent").add(new Option(a, a));
let lap, g, frame = 0, playing = true, last = performance.now();
const HZ = DATA.rules.agentHz;

function pick() {
  lap = DATA.laps.find((l) => l.circuitId === $("circuit").value && l.agent === $("agent").value);
  g = geo[lap.circuitId];
  frame = 0;
  const fmt = (s) => fmtTime(s);
  $("meta").textContent = `${g.t.name}, ${g.t.location} · ${(g.t.lengthM / 1000).toFixed(3)} km · rules ${DATA.rules.id} · replaying seed ${lap.seed + 1} · ${lap.team.name} livery`;
  $("official").innerHTML = "<tr><th>Seed</th><th>Steps</th><th>Time</th><th>Result</th></tr>" +
    lap.official.map((o) => `<tr><td>${o.seed + 1}${o.seed === lap.seed ? " ▸" : ""}</td><td>${o.steps.toLocaleString()}</td><td>${o.status === "finished" ? fmt(o.steps) : "–"}</td><td>${o.status}</td></tr>`).join("") +
    `<tr><th>Median</th><th></th><th>${lap.medianSteps ? fmt(lap.medianSteps) : "not ranked"}</th><th></th></tr>`;
  drawTelemetryBase();
}
function fmtTime(steps) {
  const cs = Math.round(steps / HZ * 100), m = Math.floor(cs / 6000);
  return `${m}:${((cs % 6000) / 100).toFixed(2).padStart(5, "0")}`;
}

// ---------- canvases ----------
function fit(cv) {
  const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1;
  if (cv.width !== Math.round(r.width * d) || cv.height !== Math.round(r.height * d)) { cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); }
  return d;
}
function sample(arr, f) { const i = Math.floor(f), k = f - i; const a = arr[i], b = arr[Math.min(i + 1, arr.length - 1)]; return a + (b - a) * k; }
function sampleAngle(arr, f) { const i = Math.floor(f), k = f - i; const a = arr[i]; let b = arr[Math.min(i + 1, arr.length - 1)]; let d = b - a; if (d > Math.PI) d -= 2*Math.PI; if (d < -Math.PI) d += 2*Math.PI; return a + d * k; }

const LOCK = "#8fd0ff", SPIN = "#ff8a3d";
const slideAt = (arr, i) => (arr && arr[i]) || 0;
/** Lock-up (front, or rear under braking) or wheelspin (rear on throttle) at step i. */
function tyreState(i) {
  const f = slideAt(lap.frontSlide, i), r = slideAt(lap.rearSlide, i), braking = lap.throttle[i] < 0;
  return { f, r, rearColor: braking ? LOCK : SPIN, label: f > 0 && r > 0 ? (braking ? "LOCK-UP: ALL FOUR" : "LOCK-UP + WHEELSPIN") : f > 0 ? "FRONT LOCK-UP" : r > 0 ? (braking ? "REAR LOCK-UP" : "WHEELSPIN") : "" };
}
/** Wheel centres in car coordinates (metres): front axle at the CG + 1.65, rear at −1.75. */
const WHEELS = { front: [[1.6, 0.74], [1.6, -0.74]], rear: [[-1.75, 0.74], [-1.75, -0.74]] };

function drawCar(ctx, colors, ts) {
  const Lh = DATA.rules.car.length / 2, Wh = DATA.rules.car.width / 2; // 2.65, 0.95
  if (ts && (ts.f > 0 || ts.r > 0)) {
    // Tyre smoke trailing behind sliding wheels.
    for (const [axle, k, col] of [["front", ts.f, "rgba(235,240,245,"], ["rear", ts.r, "rgba(235,240,245,"]]) {
      if (k <= 0) continue;
      for (const [wx, wy] of WHEELS[axle]) for (let j = 1; j <= 4; j++) {
        ctx.beginPath(); ctx.arc(wx - j * 0.7, wy, 0.35 + 0.25 * j * k, 0, 2 * Math.PI);
        ctx.fillStyle = col + (0.35 * k / j).toFixed(3) + ")"; ctx.fill();
      }
    }
  }
  for (const [x0, x1, axle] of [[-2.15, -1.35, "rear"], [1.25, 1.95, "front"]]) for (const s of [-1, 1]) {
    const k = ts ? (axle === "front" ? ts.f : ts.r) : 0;
    ctx.fillStyle = k > 0 ? (axle === "front" ? LOCK : ts.rearColor) : "#111";
    ctx.fillRect(x0, s > 0 ? Wh - 0.42 : -Wh, x1 - x0, 0.42);
  }
  ctx.fillStyle = colors.secondary;
  ctx.fillRect(-Lh, -0.78, 0.38, 1.56);                     // rear wing
  ctx.fillRect(Lh - 0.32, -Wh + 0.05, 0.32, 2 * Wh - 0.1);    // front wing
  ctx.fillStyle = colors.primary;
  ctx.beginPath();
  const pts = [[Lh - 0.2, 0.1], [1.3, 0.2], [0.7, 0.42], [-0.2, 0.62], [-1.2, 0.55], [-2.25, 0.28]];
  ctx.moveTo(Lh - 0.05, 0);
  for (const [x, y] of pts) ctx.lineTo(x, y);
  for (const [x, y] of pts.slice().reverse()) ctx.lineTo(x, -y);
  ctx.closePath(); ctx.fill();
  ctx.lineWidth = 0.07; ctx.strokeStyle = "rgba(255,255,255,.85)"; ctx.stroke();
  ctx.fillStyle = colors.accent;
  ctx.fillRect(-1.6, -0.08, 3.4, 0.16);                     // spine stripe
  ctx.fillStyle = "#0b0b0b";
  ctx.beginPath(); ctx.ellipse(0.2, 0, 0.42, 0.24, 0, 0, 2 * Math.PI); ctx.fill(); // cockpit
}

function drawMain() {
  const cv = $("main"), ctx = cv.getContext("2d"), d = fit(cv);
  const W = cv.width, H = cv.height, zoom = Number($("zoom").value) * d;
  const x = sample(lap.x, frame), y = sample(lap.y, frame), yaw = sampleAngle(lap.yaw, frame);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = css("--grass"); ctx.fillRect(0, 0, W, H);
  // World metres, y up, centred on the car.
  ctx.setTransform(zoom, 0, 0, -zoom, W / 2 - x * zoom, H / 2 + y * zoom);
  ctx.fillStyle = css("--asphalt"); ctx.fill(g.surface, "evenodd");
  ctx.lineWidth = 0.3; ctx.strokeStyle = css("--edge"); ctx.stroke(g.left); ctx.stroke(g.right);
  ctx.lineWidth = 0.15; ctx.strokeStyle = css("--gate"); ctx.stroke(g.gates);
  ctx.lineWidth = 0.6; ctx.strokeStyle = css("--start"); ctx.stroke(g.start);
  // Trail: the last 6 seconds.
  ctx.beginPath();
  const from = Math.max(0, Math.floor(frame) - 6 * HZ);
  for (let i = from; i <= Math.floor(frame); i++) i === from ? ctx.moveTo(lap.x[i], lap.y[i]) : ctx.lineTo(lap.x[i], lap.y[i]);
  ctx.lineTo(x, y); ctx.strokeStyle = css("--trail"); ctx.lineWidth = 0.35; ctx.stroke();
  // Skid marks: every sliding wheel over the last 20 seconds leaves a dark streak.
  const fi = Math.floor(frame);
  for (let i = Math.max(1, fi - 20 * HZ); i <= fi; i++) {
    const kf = slideAt(lap.frontSlide, i), kr = slideAt(lap.rearSlide, i);
    if (kf <= 0 && kr <= 0) continue;
    for (const [axle, k] of [["front", kf], ["rear", kr]]) {
      if (k <= 0) continue;
      ctx.strokeStyle = `rgba(10,10,12,${(0.25 + 0.5 * k).toFixed(2)})`; ctx.lineWidth = 0.3;
      for (const [wx, wy] of WHEELS[axle]) {
        const at = (j) => [lap.x[j] + Math.cos(lap.yaw[j]) * wx - Math.sin(lap.yaw[j]) * wy, lap.y[j] + Math.sin(lap.yaw[j]) * wx + Math.cos(lap.yaw[j]) * wy];
        const [x0, y0] = at(i - 1), [x1, y1] = at(i);
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
      }
    }
  }
  ctx.save(); ctx.translate(x, y); ctx.rotate(yaw); drawCar(ctx, lap.team.colors, tyreState(fi)); ctx.restore();
  // Scale bar.
  ctx.setTransform(d, 0, 0, d, 0, 0);
  const m = 20, px = m * zoom / d;
  ctx.fillStyle = css("--fg"); ctx.fillRect(16, H / d - 20, px, 2);
  ctx.font = "12px system-ui"; ctx.fillText(`${m} m`, 16, H / d - 26);
}

function drawMap() {
  const cv = $("map"), ctx = cv.getContext("2d"), d = fit(cv);
  const W = cv.width, H = cv.height, b = g.bounds, pad = 12 * d;
  const s = Math.min((W - 2 * pad) / (b.maxX - b.minX), (H - 2 * pad) / (b.maxY - b.minY));
  const ox = (W - (b.maxX - b.minX) * s) / 2 - b.minX * s, oy = (H + (b.maxY - b.minY) * s) / 2 + b.minY * s;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);
  ctx.setTransform(s, 0, 0, -s, ox, oy);
  ctx.fillStyle = css("--asphalt"); ctx.fill(g.surface, "evenodd");
  ctx.lineWidth = 2 / s * d; ctx.strokeStyle = css("--start"); ctx.stroke(g.start);
  ctx.beginPath();
  for (let i = 0; i <= Math.floor(frame); i += 2) i ? ctx.lineTo(lap.x[i], lap.y[i]) : ctx.moveTo(lap.x[0], lap.y[0]);
  ctx.strokeStyle = css("--trail"); ctx.lineWidth = 1.5 * d / s; ctx.stroke();
  ctx.fillStyle = lap.team.colors.primary; ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5 * d / s;
  ctx.beginPath(); ctx.arc(sample(lap.x, frame), sample(lap.y, frame), 5 * d / s, 0, 2 * Math.PI); ctx.fill(); ctx.stroke();
}

let teleBase = null;
function drawTelemetryBase() {
  const cv = $("tele"), d = fit(cv), W = cv.width, H = cv.height, n = lap.speed.length;
  const off = document.createElement("canvas"); off.width = W; off.height = H;
  const ctx = off.getContext("2d");
  const vmax = Math.max(...lap.speed, 1);
  for (let i = 0; i < n; i++) {
    const t = lap.throttle[i], xp = (i / (n - 1)) * W;
    ctx.fillStyle = t >= 0 ? css("--throttle") : css("--brake");
    ctx.globalAlpha = 0.25; ctx.fillRect(xp, H - Math.min(1, Math.abs(t)) * H * 0.3, W / n + 1, H);
  }
  ctx.globalAlpha = 1;
  // Lock-ups (blue) and wheelspin (orange) as ticks along the top.
  for (let i = 0; i < n; i++) {
    const ts = tyreState(i); if (!ts.f && !ts.r) continue;
    ctx.fillStyle = ts.f > 0 ? LOCK : ts.rearColor; ctx.fillRect((i / (n - 1)) * W, 18 * d, Math.max(1, W / n), 8 * d);
  }
  ctx.beginPath();
  for (let i = 0; i < n; i++) { const xp = (i / (n - 1)) * W, yp = H - 6 * d - (lap.speed[i] / vmax) * (H - 18 * d); i ? ctx.lineTo(xp, yp) : ctx.moveTo(xp, yp); }
  ctx.strokeStyle = css("--speed"); ctx.lineWidth = 1.5 * d; ctx.stroke();
  ctx.fillStyle = css("--muted"); ctx.font = `${11 * d}px system-ui`;
  ctx.fillText(`speed (peak ${Math.round(vmax * 3.6)} km/h), throttle green, brake red; ticks: lock-up blue, wheelspin orange`, 8 * d, 14 * d);
  teleBase = off;
}
function drawTelemetry() {
  const cv = $("tele"), d = fit(cv), ctx = cv.getContext("2d");
  if (!teleBase || teleBase.width !== cv.width || teleBase.height !== cv.height) drawTelemetryBase();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height); ctx.drawImage(teleBase, 0, 0);
  const xp = (frame / (lap.speed.length - 1)) * cv.width;
  ctx.fillStyle = css("--fg"); ctx.fillRect(xp - d, 0, 2 * d, cv.height);
}

function hud() {
  const i = Math.floor(frame), done = i >= lap.steps;
  $("time").textContent = fmtTime(Math.min(frame, lap.steps));
  $("speed").textContent = `${Math.round(sample(lap.speed, frame) * 3.6)} km/h`;
  $("gate").textContent = `${lap.gates[i]} / ${g.t.gates.length}`;
  $("result").textContent = done ? `${lap.status}${lap.status === "finished" ? " " + fmtTime(lap.steps) : ` at gate ${lap.gatesPassed}`}` : "running";
  const ts = tyreState(Math.min(i, lap.x.length - 1));
  $("tyres").textContent = ts.label || "gripping";
  $("tyres").style.color = ts.label ? (ts.f > 0 ? "#2f8fd6" : ts.rearColor === SPIN ? "#d9622b" : "#2f8fd6") : "";
  const t = Math.max(-1, Math.min(1, lap.throttle[i])), s = Math.max(-1, Math.min(1, lap.steer[i]));
  Object.assign($("thr").style, { left: t >= 0 ? "50%" : `${50 + t * 50}%`, width: `${Math.abs(t) * 50}%`, background: t >= 0 ? css("--throttle") : css("--brake") });
  Object.assign($("str").style, { left: s >= 0 ? "50%" : `${50 + s * 50}%`, width: `${Math.abs(s) * 50}%`, background: css("--steer") });
}

function tick(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (playing) {
    frame += dt * HZ * Number($("rate").value);
    if (frame >= lap.steps) { frame = lap.steps; playing = false; $("play").textContent = "Play"; }
  }
  drawMain(); drawMap(); drawTelemetry(); hud();
  requestAnimationFrame(tick);
}

const setPlaying = (p) => { playing = p; if (p && frame >= lap.steps) frame = 0; $("play").textContent = p ? "Pause" : "Play"; };
$("play").onclick = () => setPlaying(!playing);
$("restart").onclick = () => { frame = 0; setPlaying(true); };
$("circuit").onchange = $("agent").onchange = () => { pick(); setPlaying(true); };
addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT") return;
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === "r" || e.key === "R") { frame = 0; setPlaying(true); }
  else if (e.key === "ArrowRight") { setPlaying(false); frame = Math.min(lap.steps, Math.floor(frame) + 1); }
  else if (e.key === "ArrowLeft") { setPlaying(false); frame = Math.max(0, Math.ceil(frame) - 1); }
  else if (e.key === "+" || e.key === "=") $("zoom").value = Number($("zoom").value) + 0.5;
  else if (e.key === "-") $("zoom").value = Number($("zoom").value) - 0.5;
});
$("tele").onclick = (e) => { const r = $("tele").getBoundingClientRect(); frame = ((e.clientX - r.left) / r.width) * lap.steps; };
addEventListener("resize", () => drawTelemetryBase());
pick();
requestAnimationFrame(tick);
</script>
</body>
</html>
